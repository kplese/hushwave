<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hushwave Tinnitus Relief</title>
<meta name="description" content="Hushwave: Tinnitus Relief. Personal sounds designed around your tinnitus pitch. Private, on-device, no account.">
<style>
  :root { --bg: #0B1320; --text: #E6EEF6; --muted: #A9B8C8; --accent: #7FD1C7; --border: #1E2C42; }
  @media (prefers-color-scheme: light) {
    :root { --bg: #F6F9FC; --text: #0B1320; --muted: #4A5A6E; --accent: #1F7F75; --border: #DCE4EE; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--text);
    font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  main { max-width: 560px; padding: 48px 16px; text-align: center; }
  h1 { font-size: 2.25rem; margin: 0 0 8px; }
  h1 span { color: var(--accent); }
  p { color: var(--muted); margin: 0 0 32px; }
  nav a {
    display: inline-block; padding: 12px 22px; border: 1px solid var(--accent); border-radius: 999px;
    color: var(--accent); text-decoration: none; font-weight: 600;
  }
  nav a:hover, nav a:focus-visible { background: var(--accent); color: var(--bg); }
  footer { margin-top: 40px; font-size: .85rem; color: var(--muted); }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Hush<span>wave</span></h1>
  <p>Tinnitus relief sounds designed around your own pitch. Private, on-device, no account.</p>
  <nav><a href="privacy.html">Privacy Policy</a></nav>
  <footer>Contact: <a href="mailto:hushwave.app@gmail.com">hushwave.app@gmail.com</a></footer>
</main>
</body>
</html>
